[package]
name = "herdr-reviewr"
version = "0.30.4"
edition = "2024"
rust-version = "1.97"
description = "A terminal review pane for herdr: browse an agent's changes and send comments back to chat."
authors = ["Dmitry Persiyanov <dmitry.persiyanov@gmail.com>"]
license = "MIT"
repository = "https://github.com/persiyanov/herdr-reviewr"
readme = "README.md"
keywords = ["herdr", "tui", "diff", "review", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
dirs = "6"
fff-search = "0.10.0"
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = { version = "3.1.1", features = ["text"] }
# Dumps + fancy-regex only: no yaml-load (we read prebuilt binary syntax dumps, so the
# unmaintained yaml-rust never enters the tree), no onig (pure-Rust regex engine).
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-fancy", "dump-load", "plist-load"] }
toml = "1.1"
two-face = "0.5.1"
unicode-width = "0.2"

# Windows-only. Both replace a subprocess unix can spawn and Windows cannot do safely, and both
# fail the same way when forced: some parser between reviewr and the payload rewrites it. Gated by
# target so no unix dependency graph changes. Their own `unsafe` is their business, since
# `unsafe_code = "forbid"` is per-crate.
#
# clipboard-win: `clip.exe` decodes stdin with the shared console codepage (it corrupts Korean
# text on cp949) and `powershell -Command Set-Clipboard` loses non-ASCII across the argv boundary
# besides costing ~250 ms. The clipboard API takes UTF-16 directly, at ~0.3 ms.
#
# opener: `ShellExecuteW`, the shell's protocol association. `cmd /C start` expands `%…%` and
# splits on `&`; `explorer.exe` opens a folder window instead of the link whenever the URL carries
# a query string, and reports success while doing it. Both measured on Windows 11.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5.4.1"
opener = "0.8.5"

[dev-dependencies]
tempfile = "3"

# Test scaffolding, never a shipped capability. `just test`, `just lint`, and CI all pass
# `--all-features`, so the fake below builds for every test run; a plain `cargo install` resolves
# default features only and installs `herdr-reviewr` alone.
[features]
test-support = []

# The fake herdr `tests/send_flow.rs` swaps in for the real one (`src/herdr.rs` spawns
# `$HERDR_BIN_PATH`). A binary target rather than a shell script because Windows has no shebang,
# and rather than an example because `cargo test --test send_flow` does not build examples.
[[bin]]
name = "fake-herdr"
path = "tests/support/fake_herdr.rs"
required-features = ["test-support"]

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pragmatic allows for an application binary (vs a public library):
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
too_many_lines = "allow"

[profile.release]
strip = true
lto = "thin"
